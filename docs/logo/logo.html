<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Party TV logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500,100;1,9..144,600,100&display=block" rel="stylesheet">
<style>
:root { --felt: #0c201b; --felt-2: #17403a; --ivory: #f3eee2; --gold: #d9b26a; --gold-2: #f0d9a0; --copper: #c7834f; }
html, body { margin: 0; background: var(--felt); }
.card { position: relative; overflow: hidden; background: radial-gradient(ellipse 90% 120% at 22% 50%, var(--felt-2) 0%, var(--felt) 70%); }
#banner { width: 640px; height: 360px; display: flex; align-items: center; padding-left: 52px; box-sizing: border-box; }
#banner .chip { width: 216px; height: 216px; flex: none; }
#banner .words { margin-left: 34px; }
.word { font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 600; font-variation-settings: "SOFT" 100, "opsz" 144; color: var(--ivory); line-height: .86; letter-spacing: -1px; }
.word span { display: block; }
#banner .word { font-size: 118px; }
.tag { margin-top: 14px; font-family: "Fraunces", Georgia, serif; font-style: normal; font-weight: 500; font-variation-settings: "SOFT" 100, "opsz" 14; font-size: 21px; color: #a9bfb7; letter-spacing: .3px; }
#icon { width: 512px; height: 512px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 42%, var(--felt-2) 0%, var(--felt) 72%); }
#icon .chip { width: 400px; height: 400px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="face" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#f0d9a0"/><stop offset=".55" stop-color="#d9b26a"/><stop offset="1" stop-color="#b38b45"/>
    </radialGradient>
    <symbol id="chip" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="96" fill="url(#face)"/>
      <circle cx="100" cy="100" r="86" fill="none" stroke="#c7834f" stroke-width="17" stroke-dasharray="22.4 45.9" stroke-dashoffset="11.2" transform="rotate(-90 100 100)"/>
      <circle cx="100" cy="100" r="96" fill="none" stroke="#f0d9a0" stroke-opacity=".55" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="64" fill="#0c201b"/>
      <circle cx="100" cy="100" r="57" fill="none" stroke="#d9b26a" stroke-width="2" stroke-dasharray="3 6"/>
      <path d="M100 58 C104 86 114 96 142 100 C114 104 104 114 100 142 C96 114 86 104 58 100 C86 96 96 86 100 58 Z" fill="#f3eee2"/>
      <circle cx="132" cy="70" r="5" fill="#f0d9a0"/>
      <circle cx="70" cy="132" r="3.5" fill="#c7834f"/>
    </symbol>
  </defs>
</svg>
<div id="banner" class="card">
  <svg class="chip"><use href="#chip"/></svg>
  <div class="words">
    <div class="word"><span>Party</span><span>TV</span></div>
  </div>
</div>
<div id="icon" class="card"><svg class="chip"><use href="#chip"/></svg></div>
</body>
</html>
