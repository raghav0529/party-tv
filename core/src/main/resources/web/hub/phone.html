<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c201b">
<title>Party TV</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #0c201b;
  color: #f3eee2;
  font-family: -apple-system, "Roboto", "Noto Sans", "Noto Sans Devanagari", "Droid Sans", "Segoe UI", "Mangal", Arial, sans-serif;
  font-size: 19px;
  line-height: 1.35;
  -webkit-text-size-adjust: 100%;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.page { max-width: 760px; margin: 0 auto; padding: 16px 12px 40px; }
h1 { margin: 4px 0 4px; font-family: Georgia, "Noto Serif", "Droid Serif", serif; color: #d9b26a; font-size: 34px; text-align: center; }
.lead { margin: 0 0 18px; color: #f3eee2; text-align: center; }
.status { margin: 20px 0; color: #f3eee2; text-align: center; }

/* One column on a phone. Wider screens add columns by themselves, so more tiles just fit. */
#tiles { display: flex; flex-wrap: wrap; margin: 0 -6px; }
.tile-wrap { flex: 1 1 320px; min-width: 0; padding: 0 6px 12px; }
.tile {
  display: flex;
  align-items: center;
  width: 100%;
  min-height: 112px;
  padding: 14px;
  border: 2px solid #d9b26a;
  border-radius: 14px;
  background: #0c201b;
  color: #f3eee2;
  font: inherit;
  text-align: left;
  cursor: pointer;
  -webkit-appearance: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.tile:active { background: #143630; }
.tile[disabled] { border-color: #2f5c52; cursor: default; }
.tile.opening { background: #d9b26a; border-color: #d9b26a; color: #0c201b; }
.tile.opening .tile-sub { color: #0c201b; }
.tile.opening .tile-icon { background: #0c201b; }
.tile:focus-visible { outline: 3px solid #ffffff; outline-offset: 1px; }
.tile-icon {
  flex: 0 0 auto;
  display: block;
  width: 72px;
  height: 72px;
  margin-right: 14px;
  padding: 12px;
  border-radius: 50%;
  background: #0c201b;
}
.tile-icon svg { display: block; width: 100%; height: 100%; }
.tile-text { flex: 1 1 auto; min-width: 0; display: block; }
.tile-title { display: block; font-family: Georgia, "Noto Serif", "Droid Serif", serif; font-size: 26px; font-weight: bold; line-height: 1.2; }
.tile-sub { display: block; margin-top: 4px; color: #f3eee2; font-size: 18px; }

#banner {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  padding: 8px 12px;
  background: #d9b26a;
  color: #0c201b;
  font-size: 17px;
  font-weight: bold;
  text-align: center;
}
#toast {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 16px;
  z-index: 10;
  max-width: 480px;
  margin: 0 auto;
  padding: 14px;
  background: #143630;
  border: 2px solid #e8806a;
  color: #ffffff;
  border-radius: 10px;
  font-weight: bold;
  text-align: center;
}
</style>
</head>
<body>
<div id="banner" role="alert" style="display:none">Can't reach the TV. Check you are on the same WiFi.</div>

<div class="page">
  <h1>Party TV</h1>
  <p class="lead">Tap one. It opens on the TV for everyone.</p>
  <p id="status" class="status" role="status">Connecting to the TV...</p>
  <div id="tiles"></div>
</div>

<div id="toast" role="alert" style="display:none"></div>

<script src="/shared/hub-client.js"></script>
<script>
(function () {
  var POLL_MS = 2000;
  var TIMEOUT_MS = 6000;
  var OFFLINE_TEXT = "Can't reach the TV. Check you are on the same WiFi.";

  /* Add a drawing here when a new app wants its own icon. Unknown icons get the star. */
  var ICONS = {
    speech: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-4 4v-4H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#d9b26a"/></svg>',
    film: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2" fill="#d9b26a"/><circle cx="12" cy="12" r="3" fill="#0c201b"/></svg>',
    charades: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="6" r="3" fill="#d9b26a"/><path d="M8 10v7M8 17l-3 5M8 17l3 5M8 12L3 8M8 12l5-4" fill="none" stroke="#d9b26a" stroke-width="2" stroke-linecap="round"/><path d="M16 4a2.5 2.5 0 0 1 5 0c0 2-2.500 2-2.500 4.500" fill="none" stroke="#d9b26a" stroke-width="2" stroke-linecap="round"/><circle cx="18.500" cy="12" r="1.300" fill="#d9b26a"/></svg>',
    mic: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="2" width="7" height="12.5" rx="3.5" fill="#d9b26a"/><path d="M5 11.5a7 7 0 0 0 14 0M12 18.5V22M8 22h8" fill="none" stroke="#d9b26a" stroke-width="2" stroke-linecap="round"/></svg>',
    wheel: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#d9b26a" stroke-width="2"/><path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9L4.9 19.1" stroke="#d9b26a" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="#d9b26a"/></svg>',
    pencil: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 3l4.5 4.5L8.5 20 3 21l1-5.5z" fill="#d9b26a"/><path d="M14.5 5l4.5 4.5" stroke="#0c201b" stroke-width="1.6"/></svg>',
    star: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 7h7l-5.6 4.6L18.5 21 12 16.7 5.5 21l2.1-7.4L2 9h7z" fill="#d9b26a"/></svg>'
  };

  function byId(id) { return document.getElementById(id); }
  function show(el, visible) { el.style.display = visible ? '' : 'none'; }

  var els = { banner: byId('banner'), status: byId('status'), tiles: byId('tiles'), toast: byId('toast') };

  /* cb(ok, data, gotReply) */
  function request(method, url, body, cb) {
    var finished = false;
    function finish(ok, data, gotReply) {
      if (finished) { return; }
      finished = true;
      cb(ok, data, gotReply);
    }
    var xhr = new XMLHttpRequest();
    try {
      xhr.open(method, url, true);
      xhr.timeout = TIMEOUT_MS;
      xhr.setRequestHeader('Cache-Control', 'no-cache');
      if (body !== null) { xhr.setRequestHeader('Content-Type', 'application/json'); }
      xhr.ontimeout = function () { finish(false, null, false); };
      xhr.onerror = function () { finish(false, null, false); };
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4 || xhr.status === 0) { return; }
        var data = null;
        try { data = JSON.parse(xhr.responseText); } catch (e) { data = null; }
        finish(xhr.status >= 200 && xhr.status < 300, data, true);
      };
      xhr.send(body);
    } catch (e) {
      finish(false, null, false);
    }
  }

  var toastTimer = null;
  function toast(text) {
    els.toast.textContent = text;
    show(els.toast, true);
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { show(els.toast, false); }, 5000);
  }

  /* ---------- tiles ---------- */

  var tilesSig = null;
  var opening = false;

  function iconMarkup(name) {
    return ICONS.hasOwnProperty(name) ? ICONS[name] : ICONS.star;
  }

  function buildTile(app) {
    var wrap = document.createElement('div');
    wrap.className = 'tile-wrap';

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tile';

    var icon = document.createElement('span');
    icon.className = 'tile-icon';
    icon.innerHTML = iconMarkup(app.icon); /* Only ever one of the fixed drawings above. */
    btn.appendChild(icon);

    var text = document.createElement('span');
    text.className = 'tile-text';
    var title = document.createElement('span');
    title.className = 'tile-title';
    title.textContent = app.title || app.id;
    text.appendChild(title);
    var sub = document.createElement('span');
    sub.className = 'tile-sub';
    sub.textContent = app.subtitle || '';
    text.appendChild(sub);
    btn.appendChild(text);

    btn.onclick = function () { openApp(app, btn, sub); };
    wrap.appendChild(btn);
    return wrap;
  }

  function renderTiles(apps) {
    var sig = JSON.stringify(apps);
    if (sig === tilesSig) { return; }
    /* Never swap the tiles out from under a tap that is on its way. */
    if (opening) { return; }
    tilesSig = sig;
    els.tiles.innerHTML = '';
    for (var i = 0; i < apps.length; i++) {
      els.tiles.appendChild(buildTile(apps[i]));
    }
    els.status.textContent = 'No apps yet.';
    show(els.status, apps.length === 0);
  }

  function setAllDisabled(disabled) {
    var buttons = els.tiles.getElementsByTagName('button');
    for (var i = 0; i < buttons.length; i++) { buttons[i].disabled = disabled; }
  }

  function openApp(app, btn, sub) {
    if (opening) { return; }
    opening = true;
    var oldSub = sub.textContent;
    setAllDisabled(true);
    btn.className = 'tile opening';
    sub.textContent = 'Opening on the TV...';

    function undo() {
      opening = false;
      setAllDisabled(false);
      btn.className = 'tile';
      sub.textContent = oldSub;
    }

    request('POST', '/api/hub/open', JSON.stringify({ id: app.id }), function (ok, data, gotReply) {
      if (ok) {
        location.replace('/phone/' + encodeURIComponent(app.id));
        return;
      }
      undo();
      toast(data && data.error ? String(data.error) : (gotReply ? 'That did not open. Please try again.' : OFFLINE_TEXT));
    });
  }

  /* ---------- polling ---------- */

  var pollTimer = null;
  var pollBusy = false;

  function poll() {
    if (pollBusy) { return; }
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
    pollBusy = true;
    request('GET', '/api/hub', null, function (ok, data) {
      pollBusy = false;
      try {
        if (ok && data && data.apps) {
          show(els.banner, false);
          renderTiles(data.apps);
          /* hub-client.js normally does this. It is here in case that script did not load. */
          if (data.active && !window.HubClient) {
            location.replace('/phone/' + encodeURIComponent(data.active));
          }
        } else {
          show(els.banner, true);
        }
      } catch (e) {
        /* Keep polling whatever happens. */
      }
      pollTimer = setTimeout(poll, POLL_MS);
    });
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { poll(); }
  });

  try {
    if (window.HubClient) { window.HubClient.start({ kind: 'phone', app: null }); }
  } catch (e) {
    /* This page still works without it. */
  }
  poll();
})();
</script>
</body>
</html>
